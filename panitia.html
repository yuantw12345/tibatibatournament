<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Panitia — Tiba Tiba Tournament</title>
    <!-- Favicon Custom Logo -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/dtQkGVr7/Gemini-Generated-Image-itp7iuitp7iuitp7-removebg-preview.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #080a0f; color: #f1f5f9; font-family: sans-serif; }
    </style>
</head>
<body class="p-6">

    <!-- MODAL LOGIN PANITIA -->
    <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-[#080a0f]/95 backdrop-blur-md p-4">
        <div class="relative w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-14 h-14 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-xl mx-auto mb-3 border border-emerald-500/30">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-xl font-bold text-white">LOGIN PANEL PANITIA</h2>
                <p class="text-xs text-slate-400 mt-1">Masukkan akses resmi untuk mengelola data turnamen.</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Username</label>
                    <input type="text" id="username" required placeholder="Username panitia" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-xs uppercase rounded-xl transition-all shadow-lg">
                    MASUK PANEL
                </button>
            </form>
            <div class="mt-4 text-center">
                <a href="index.html" class="text-xs text-slate-500 hover:text-slate-300">← Kembali ke Beranda Utama</a>
            </div>
        </div>
    </div>

    <!-- HALAMAN UTAMA PANEL PANITIA (Disembunyikan sebelum login) -->
    <div id="panelContent" class="max-w-6xl mx-auto hidden">
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
            <h1 class="text-2xl font-bold text-white flex items-center gap-3">
                <i class="fa-solid fa-shield-halved text-emerald-400"></i> PANEL PANITIA - DATA PENDAFTARAN
            </h1>
            <div class="flex items-center gap-3">
                <button onclick="logout()" class="px-4 py-2 bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white text-xs rounded-lg transition-all border border-red-500/20">
                    <i class="fa-solid fa-right-from-bracket"></i> Keluar
                </button>
                <a href="index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg text-slate-300">Kembali ke Beranda</a>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400">
                            <th class="p-3">Waktu</th>
                            <th class="p-3">Nama Lengkap</th>
                            <th class="p-3">ID Mobile Legends</th>
                            <th class="p-3">Role</th>
                            <th class="p-3">Pembayaran</th>
                            <th class="p-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable">
                        <tr><td colspan="6" class="p-6 text-center text-slate-500">Memuat data dari Google Sheet...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // URL Google Apps Script Terbaru kamu
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz9U3eiLTuUdpkIo0HOqTe4_kHbnBqbUDn-x4TvQBLaR2mOKI6qxzY642Sn19nLFazM/exec';

        // Cek apakah panitia sudah login sebelumnya di browser ini
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('panitiaLoggedIn') === 'true') {
                showPanel();
            }
        });

        // Fungsi Login (Kamu bisa ganti username & password di sini sesuai keinginan)
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Username default: admin | Password default: tibatiba2026 (bisa diubah sesukamu)
            if (user === 'admin' && pass === 'tibatiba2026') {
                localStorage.setItem('panitiaLoggedIn', 'true');
                showPanel();
            } else {
                alert('Username atau Password salah!');
            }
        }

        function showPanel() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('panelContent').classList.remove('hidden');
            loadData();
        }

        function logout() {
            localStorage.removeItem('panitiaLoggedIn');
            location.reload();
        }

        function loadData() {
            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('dataTable');
                    tbody.innerHTML = '';

                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-500">Belum ada data pendaftaran yang masuk.</td></tr>';
                        return;
                    }

                    data.reverse().forEach(row => {
                        const tr = document.createElement('tr');
                        tr.className = 'border-b border-slate-800 hover:bg-slate-800/50';
                        tr.innerHTML = `
                            <td class="p-3 text-slate-400">${row.timestamp || '-'}</td>
                            <td class="p-3 font-bold text-white">${row.nama || '-'}</td>
                            <td class="p-3 text-cyan-400">${row.idMl || '-'}</td>
                            <td class="p-3 text-slate-300">${row.role || '-'}</td>
                            <td class="p-3"><span class="px-2 py-1 bg-emerald-500/10 text-emerald-400 rounded">${row.payment || '-'}</span></td>
                            <td class="p-3 text-center">
                                <button onclick="deleteData(${row.rowIndex})" class="px-3 py-1 bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white rounded transition-all">
                                    <i class="fa-solid fa-trash"></i> Hapus
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(error => {
                    console.error('Gagal memuat data:', error);
                    document.getElementById('dataTable').innerHTML = '<tr><td colspan="6" class="p-6 text-center text-red-400">Gagal memuat data dari server.</td></tr>';
                });
        }

        function deleteData(rowIndex) {
            if (confirm("Apakah kamu yakin ingin menghapus data peserta ini dari Google Sheet?")) {
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete', rowIndex: rowIndex })
                })
                .then(() => {
                    alert("Data berhasil dihapus!");
                    loadData();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert("Gagal menghapus data.");
                });
            }
        }
    </script>
</body>
</html>
