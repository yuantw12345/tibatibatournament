<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANEL PANITIA — TIBA TIBA TOURNAMENT</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: { DEFAULT: '#080a0f', card: '#0f131d', border: '#1e2638' },
                        crimson: { DEFAULT: '#ff1e56', dark: '#c40d3d' },
                        emerald: { accent: '#00e699' }
                    },
                    fontFamily: {
                        display: ['Syne', 'sans-serif'],
                        tech: ['Space Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #080a0f; color: #f8faff; }
        .font-display { font-family: 'Syne', sans-serif; }
        .font-tech { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-obsidian p-4 sm:p-8">

    <!-- HEADER PANEL PANITIA -->
    <header class="max-w-7xl mx-auto flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-6 mb-6 border-b border-obsidian-border">
        <div>
            <span class="font-tech text-xs tracking-widest text-crimson font-bold uppercase">ADMINISTRATOR CONTROL PANEL</span>
            <h1 class="font-display font-extrabold text-2xl sm:text-3xl text-white">PANEL PANITIA TOURNAMENT</h1>
        </div>

        <div class="flex items-center gap-3">
            <!-- TOMBOL REFRESH HALAMAN / TAB -->
            <button onclick="refreshPage()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 font-tech font-bold text-xs transition-all cursor-pointer shadow-lg active:scale-95">
                <i class="fa-solid fa-arrows-rotate text-sm" id="refreshIcon"></i>
                <span>REFRESH DATA</span>
            </button>

            <!-- TOMBOL LOGOUT ADMIN -->
            <button onclick="adminLogout()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 font-tech font-bold text-xs transition-all cursor-pointer">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>LOGOUT</span>
            </button>
        </div>
    </header>

    <!-- CONTENT PANEL -->
    <main class="max-w-7xl mx-auto space-y-6">
        <!-- RINGKASAN STATISTIK -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 font-tech">
            <div class="bg-obsidian-card p-5 rounded-2xl border border-obsidian-border shadow-lg">
                <span class="text-xs text-slate-400 uppercase">Total Tim Mendaftar</span>
                <p id="statTotalRegistrations" class="text-3xl font-bold text-emerald-accent mt-1">0</p>
            </div>
            <div class="bg-obsidian-card p-5 rounded-2xl border border-obsidian-border shadow-lg">
                <span class="text-xs text-slate-400 uppercase">Total Akun Terdaftar</span>
                <p id="statTotalUsers" class="text-3xl font-bold text-sky-400 mt-1">0</p>
            </div>
            <div class="bg-obsidian-card p-5 rounded-2xl border border-obsidian-border shadow-lg">
                <span class="text-xs text-slate-400 uppercase">Status Server / DB</span>
                <p class="text-3xl font-bold text-emerald-accent mt-1 flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-emerald-accent animate-ping"></span> ONLINE
                </p>
            </div>
        </div>

        <!-- TABEL DATA PENDAFTAR -->
        <div class="bg-obsidian-card rounded-2xl border border-obsidian-border p-5 shadow-2xl">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4 pb-3 border-b border-obsidian-border">
                <h2 class="font-display font-bold text-lg text-white flex items-center gap-2">
                    <i class="fa-solid fa-users-gear text-emerald-accent"></i> DAFTAR TIM & USER TERDAPAT
                </h2>
                <!-- TOMBOL REFRESH KEDUA DI DEKAT TABEL -->
                <button onclick="refreshPage()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-obsidian text-slate-300 hover:text-white border border-obsidian-border font-tech text-xs cursor-pointer">
                    <i class="fa-solid fa-rotate text-xs"></i> Refresh Tab
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left font-tech text-xs text-slate-300">
                    <thead class="bg-obsidian uppercase text-[10px] text-slate-400 border-b border-obsidian-border">
                        <tr>
                            <th class="p-3">No</th>
                            <th class="p-3">Username Akun</th>
                            <th class="p-3">Nama Lengkap</th>
                            <th class="p-3">ID MLBB</th>
                            <th class="p-3">Role Utama</th>
                            <th class="p-3">Role Cadangan</th>
                            <th class="p-3">WhatsApp</th>
                            <th class="p-3">Pembayaran</th>
                            <th class="p-3">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="pendaftarTableBody" class="divide-y divide-obsidian-border">
                        <tr>
                            <td colspan="9" class="text-center py-8 text-slate-500">Memuat data pendaftar...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- SCRIPT LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, orderBy, query, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJSbXvoVqSPFbgwhRZzM4utTuJNgYsxb0",
            authDomain: "tibatibaturnament.firebaseapp.com",
            projectId: "tibatibaturnament",
            storageBucket: "tibatibaturnament.firebasestorage.app",
            messagingSenderId: "626781978918",
            appId: "1:626781978918:web:9c4caf6a1d6a2ad03541e7",
            measurementId: "G-Q64PK4M8P4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // FUNGSI REFRESH HALAMAN / TAB
        window.refreshPage = function() {
            const icon = document.getElementById('refreshIcon');
            if (icon) icon.classList.add('fa-spin');
            setTimeout(() => {
                window.location.reload();
            }, 300);
        }

        window.adminLogout = function() {
            if (confirm("Apakah Anda yakin ingin logout dari Panel Panitia?")) {
                window.location.href = "index.html";
            }
        }

        // LOAD DATA PENDAFTAR REALTIME
        function loadData() {
            const q = query(collection(db, "pendaftar"), orderBy("waktuDaftar", "desc"));
            
            onSnapshot(q, (snapshot) => {
                const tbody = document.getElementById('pendaftarTableBody');
                document.getElementById('statTotalRegistrations').innerText = snapshot.size;

                if (snapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-slate-500">Belum ada tim yang mendaftar.</td></tr>';
                    return;
                }

                let html = '';
                let index = 1;

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;

                    html += `
                        <tr class="hover:bg-obsidian/50 transition-colors">
                            <td class="p-3">${index++}</td>
                            <td class="p-3 font-bold text-emerald-accent">@${data.usernameDb || '-'}</td>
                            <td class="p-3 text-white font-bold">${data.nama || '-'}</td>
                            <td class="p-3">${data.idMl || '-'}</td>
                            <td class="p-3">${data.role1 || '-'}</td>
                            <td class="p-3">${data.role2 || '-'}</td>
                            <td class="p-3"><a href="https://wa.me/${data.whatsapp}" target="_blank" class="text-sky-400 hover:underline"><i class="fa-brands fa-whatsapp mr-1"></i>${data.whatsapp}</a></td>
                            <td class="p-3"><span class="px-2 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded text-[10px] font-bold">${data.payment || '-'}</span></td>
                            <td class="p-3">
                                <button onclick="deleteRegistration('${id}')" class="px-2.5 py-1 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded text-[10px] font-bold cursor-pointer">
                                    <i class="fa-solid fa-trash"></i> Hapus
                                </button>
                            </td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;
            });

            // LOAD TOTAL USER AKUN
            onSnapshot(collection(db, "users"), (snapshot) => {
                document.getElementById('statTotalUsers').innerText = snapshot.size;
            });
        }

        window.deleteRegistration = async function(id) {
            if (confirm("Apakah Anda yakin ingin menghapus data pendaftar ini?")) {
                try {
                    await deleteDoc(doc(db, "pendaftar", id));
                    alert("Data berhasil dihapus!");
                } catch (err) {
                    alert("Gagal menghapus data: " + err.message);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
