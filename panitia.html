<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANEL PANITIA — TIBA TIBA TOURNAMENT</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: { DEFAULT: '#080a0f', card: '#0f131d', border: '#1e2638' },
                        crimson: { DEFAULT: '#ff1e56', dark: '#c40d3d' },
                        emerald: { accent: '#00e699' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #080a0f; color: #f8faff; }
        .font-tech { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- HEADER PANEL -->
        <div class="flex flex-col md:flex-row md:items-center justify-between pb-6 mb-8 border-b border-obsidian-border gap-4">
            <div>
                <span class="font-tech text-xs tracking-widest text-emerald-accent uppercase">ADMINISTRATION CONTROL</span>
                <h1 class="font-tech text-2xl sm:text-3xl font-bold text-white mt-1">PANEL PANITIA TURNAMEN</h1>
            </div>
            <button onclick="loadParticipantData()" class="px-5 py-2.5 bg-emerald-accent text-black font-bold text-xs rounded-xl hover:bg-emerald-400 transition-all flex items-center gap-2 self-start md:self-auto shadow-lg">
                <i class="fa-solid fa-rotate"></i> REFRESH DATA
            </button>
        </div>

        <!-- TABLE DATA PESERTA -->
        <div class="bg-obsidian-card border border-obsidian-border rounded-2xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-obsidian border-b border-obsidian-border text-emerald-accent font-tech uppercase tracking-wider">
                        <tr>
                            <th class="p-4">No</th>
                            <th class="p-4">Nama Lengkap</th>
                            <th class="p-4">ID ML</th>
                            <th class="p-4">Role 1</th>
                            <th class="p-4">WhatsApp</th>
                            <th class="p-4">Role 2</th>
                            <th class="p-4">Pembayaran</th>
                            <th class="p-4">Username Akun</th>
                            <th class="p-4 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="participantTableBody" class="divide-y divide-obsidian-border">
                        <tr>
                            <td colspan="9" class="p-8 text-center text-slate-500 font-tech">Memuat data pendaftar...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // URL SCRIPT WEB APP
        const TOURNAMENT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz9U3eiLTuUdpkIo0HOqTe4_kHbnBqbUDn-x4TvQBLaR2mOKI6qxzY642Sn19nLFazM/exec';
        const DATABASE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxgB7X4vEnk2lwK3skp425b70zZdnrI6-s46s8SwBTgP0_JiwKF2dj1b8xQcL782gT4/exec';

        // MUAT DATA PESERTA SAAT HALAMAN DIBUKA
        window.addEventListener('DOMContentLoaded', loadParticipantData);

        async function loadParticipantData() {
            const tbody = document.getElementById('participantTableBody');
            tbody.innerHTML = `<tr><td colspan="9" class="p-8 text-center text-slate-400 font-tech"><i class="fa-solid fa-spinner animate-spin mr-2"></i> Mengambil data dari spreadsheet...</td></tr>`;

            try {
                const response = await fetch(TOURNAMENT_SCRIPT_URL);
                const result = await response.json();

                if (result.status === 'success' && result.data.length > 0) {
                    tbody.innerHTML = '';
                    result.data.forEach((row, index) => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-obsidian/50 transition-colors">
                                <td class="p-4 font-bold text-white">${index + 1}</td>
                                <td class="p-4 font-semibold text-white">${row.nama || '-'}</td>
                                <td class="p-4">${row.idMl || '-'}</td>
                                <td class="p-4"><span class="px-2 py-1 bg-emerald-accent/10 text-emerald-accent rounded font-tech">${row.role1 || '-'}</span></td>
                                <td class="p-4"><a href="https://wa.me/${row.whatsapp}" target="_blank" class="text-sky-400 hover:underline"><i class="fa-brands fa-whatsapp mr-1"></i>${row.whatsapp || '-'}</a></td>
                                <td class="p-4">${row.role2 || '-'}</td>
                                <td class="p-4"><span class="px-2 py-1 bg-amber-500/10 text-amber-400 rounded font-tech">${row.payment || '-'}</span></td>
                                <td class="p-4 text-slate-400 font-tech">${row.usernameDb || '-'}</td>
                                <td class="p-4 text-center">
                                    <button onclick="deleteParticipant(${index + 2}, '${row.usernameDb}')" class="px-3 py-1.5 bg-crimson/20 text-crimson hover:bg-crimson hover:text-white rounded-lg font-bold transition-all">
                                        <i class="fa-solid fa-trash mr-1"></i> Hapus
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="9" class="p-8 text-center text-slate-500 font-tech">Belum ada pendaftar turnamen.</td></tr>`;
                }
            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="9" class="p-8 text-center text-crimson font-tech">Gagal mengambil data peserta.</td></tr>`;
            }
        }

        // FUNGSI HAPUS PESERTA & BUKA KUNCI AKUN OTOMATIS
        async function deleteParticipant(rowIndex, usernameDb) {
            if (!confirm(`Apakah Anda yakin ingin menghapus peserta ini? Akun [${usernameDb}] akan dibuka kembali agar bisa mendaftar ulang.`)) {
                return;
            }

            try {
                // 1. Hapus dari Spreadsheet Data Turnamen
                await fetch(TOURNAMENT_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'deleteParticipant', rowIndex: rowIndex })
                });

                // 2. Buka Kunci (Unlock) Akun di Spreadsheet Database
                if (usernameDb) {
                    await fetch(DATABASE_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'unlockAccount', username: usernameDb })
                    });
                }

                alert('Data peserta berhasil dihapus dan akun telah dibuka kembali!');
                loadParticipantData();

            } catch (error) {
                console.error(error);
                alert('Terjadi kesalahan saat menghapus data.');
            }
        }
    </script>
</body>
</html>
