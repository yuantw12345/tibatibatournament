<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Panitia — Tiba Tiba Tournament</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #080a0f; color: #f1f5f9; font-family: sans-serif; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-white"><i class="fa-solid fa-shield-halved text-emerald-400"></i> PANEL PANITIA - DATA PENDAFTARAN</h1>
            <a href="index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg text-slate-300">Kembali ke Beranda</a>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400">
                            <th class="p-3">Waktu</th>
                            <th class="p-3">Nama Lengkap</th>
                            <th class="p-3">ID Mobile Legends</th>
                            <th class="p-3">Role</th>
                            <th class="p-3">Pembayaran</th>
                            <th class="p-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable">
                        <tr><td colspan="6" class="p-6 text-center text-slate-500">Memuat data dari Google Sheet...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz9U3eiLTuUdpkIo0HOqTe4_kHbnBqbUDn-x4TvQBLaR2mOKI6qxzY642Sn19nLFazM/exec';

        function loadData() {
            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('dataTable');
                    tbody.innerHTML = '';

                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-500">Belum ada data pendaftaran yang masuk.</td></tr>';
                        return;
                    }

                    data.reverse().forEach(row => {
                        const tr = document.createElement('tr');
                        tr.className = 'border-b border-slate-800 hover:bg-slate-800/50';
                        tr.innerHTML = `
                            <td class="p-3 text-slate-400">${row.timestamp || '-'}</td>
                            <td class="p-3 font-bold text-white">${row.nama || '-'}</td>
                            <td class="p-3 text-cyan-400">${row.idMl || '-'}</td>
                            <td class="p-3 text-slate-300">${row.role || '-'}</td>
                            <td class="p-3"><span class="px-2 py-1 bg-emerald-500/10 text-emerald-400 rounded">${row.payment || '-'}</span></td>
                            <td class="p-3 text-center">
                                <button onclick="deleteData(${row.rowIndex})" class="px-3 py-1 bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white rounded transition-all">
                                    <i class="fa-solid fa-trash"></i> Hapus
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(error => {
                    console.error('Gagal memuat data:', error);
                    document.getElementById('dataTable').innerHTML = '<tr><td colspan="6" class="p-6 text-center text-red-400">Gagal memuat data.</td></tr>';
                });
        }

        function deleteData(rowIndex) {
            if (confirm("Apakah kamu yakin ingin menghapus data peserta ini?")) {
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete', rowIndex: rowIndex })
                })
                .then(() => {
                    alert("Data berhasil dihapus!");
                    loadData(); // Muat ulang tabel secara otomatis
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert("Gagal menghapus data.");
                });
            }
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
